<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BigQuery browser · KumoSQL</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/shell.css">
  <script src="/assets/shell.js"></script>
  <link rel="stylesheet" href="/assets/browse.css">
  <script defer src="/assets/bqprojects.js"></script>
  <script defer src="/assets/tags.js"></script>
  <script defer src="/assets/browse.js"></script>
  <script defer src="/assets/scopes.js"></script>
  <script defer src="/assets/settings.js"></script>
</head>
<body>
  <div class="bq-page">
    <aside class="bq-explorer" aria-label="Explorer">
      <div class="bq-explorer-head">
        <h1>Explorer</h1>
        <button id="choose-projects" class="panel-refresh bq-add" type="button" title="Choose projects" aria-label="Choose projects">+</button>
        <button id="refresh" class="panel-refresh" type="button" title="Refresh everything shown from BigQuery" aria-label="Refresh all" disabled>↻</button>
      </div>
      <div id="tag-bar" class="tag-bar" hidden>
        <select id="tag-filter" aria-label="Show only objects with a tag"></select>
      </div>
      <div id="catalog-status" class="catalog-status" role="status" aria-live="polite"></div>
      <div id="catalog-freshness" class="catalog-freshness"></div>
      <div id="tree" class="bq-tree" role="tree" aria-label="Projects, datasets, tables and columns"></div>
      <div id="tag-bulk" class="tag-bulk" hidden>
        <p><strong id="bulk-count"></strong> selected <button id="bulk-clear" type="button" class="link-button">Clear</button></p>
        <div id="bulk-editor"></div>
      </div>
    </aside>
    <main class="bq-body" aria-label="BigQuery"></main>
  </div>
</body>
</html>
