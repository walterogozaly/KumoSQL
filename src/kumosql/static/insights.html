<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>KumoSQL</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/shell.css">
  <script src="/assets/shell.js"></script>
  <link rel="stylesheet" href="/assets/insights.css">
  <script defer src="/assets/evidence.js"></script>
  <script defer src="/assets/scopes.js"></script>
  <script defer src="/assets/insights.js"></script>
  <script defer src="/assets/settings.js"></script>
</head>
<body>
  <div class="app insights-app">
    <main class="insights-main">
      <header class="page-head">
        <div>
          <p id="page-eyebrow" class="eyebrow"></p>
          <h1 id="page-title">Loading…</h1>
          <p id="page-lede" class="lede"></p>
        </div>
      </header>
      <div class="scope-bar" id="scope-bar">
        <label class="scope-pick"><span>Scope</span> <select id="scope-picker" aria-label="Active scope"></select></label>
        <button type="button" class="link-button" data-open-settings="scopes">Manage scopes</button>
        <span id="scope-note" class="scope-note" role="status"></span>
      </div>
      <div id="preview-banner" class="preview-banner" role="note" hidden>
        <strong>Preview with sample data.</strong>
        <span>This view is not connected to your project yet. Names and numbers below are examples.</span>
        <details>
          <summary>Roadmap items this view waits on</summary>
          <ul id="preview-issues"></ul>
        </details>
      </div>
      <form id="project-form" class="project-form" hidden>
        <span id="project-source" class="project-source"></span>
        <input id="project-url" type="text" class="field" placeholder="git@github.com:owner/repository.git or https://…" aria-label="Dataform git repository URL" autocomplete="off" required>
        <input id="project-branch" type="text" class="field" placeholder="branch (default)" aria-label="Branch" autocomplete="off" size="14">
        <label class="project-refresh"><input id="project-refresh" type="checkbox"> Fetch latest</label>
        <button type="submit" class="toolbar-button">Load project</button>
        <button type="button" id="project-clear" class="toolbar-button" hidden>Use sample data</button>
        <span id="project-status" class="project-status" role="status"></span>
      </form>
      <div id="load-error" class="load-error" role="alert" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>
</body>
</html>
