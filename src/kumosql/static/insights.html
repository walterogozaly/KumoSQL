<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>KumoSQL</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/shell.css">
  <script src="/assets/shell.js"></script>
  <link rel="stylesheet" href="/assets/insights.css">
  <script defer src="/assets/evidence.js"></script>
  <script defer src="/assets/scopes.js"></script>
  <script defer src="/assets/bqprojects.js"></script>
  <script defer src="/assets/insights.js"></script>
  <script defer src="/assets/settings.js"></script>
</head>
<body>
  <div class="app insights-app">
    <main class="insights-main">
      <header class="page-head">
        <div>
          <p id="page-eyebrow" class="eyebrow"></p>
          <h1 id="page-title">Loading…</h1>
          <p id="page-lede" class="lede"></p>
        </div>
      </header>
      <div class="scope-bar" id="scope-bar">
        <label class="scope-pick"><span>Scope</span> <select id="scope-picker" aria-label="Active scope"></select></label>
        <button type="button" class="link-button" data-open-settings="scopes">Manage scopes</button>
        <span id="scope-note" class="scope-note" role="status"></span>
      </div>
      <div id="project-form" class="project-form">
        <span id="project-source" class="project-source"></span>
        <button type="button" id="project-refresh" class="toolbar-button" hidden>Fetch latest</button>
        <button type="button" class="link-button" data-open-settings="repositories">Manage repositories</button>
        <span id="project-status" class="project-status" role="status"></span>
      </div>
      <div id="jobs-bar" class="project-form" hidden>
        <span id="jobs-source" class="project-source"></span>
        <label class="toolbar-button" for="jobs-file">Load job history</label>
        <input id="jobs-file" type="file" accept=".json,.jsonl,.ndjson,.csv,application/json,text/csv" hidden>
        <button type="button" id="jobs-clear" class="toolbar-button" hidden>Remove job history</button>
        <span id="jobs-status" class="project-status" role="status"></span>
      </div>
      <div id="load-error" class="load-error" role="alert" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>
</body>
</html>
