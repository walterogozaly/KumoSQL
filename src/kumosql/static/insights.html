<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>KumoSQL</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/insights.css">
  <script defer src="/assets/evidence.js"></script>
  <script defer src="/assets/insights.js"></script>
  <script defer src="/assets/settings.js"></script>
</head>
<body>
  <div class="app insights-app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">{ }</span>
        <span class="brand-text"><strong>KumoSQL</strong><span id="brand-sub">Query graph</span></span>
      </div>
      <nav class="topnav" aria-label="Main navigation">
        <a href="/">Workspace</a>
        <a href="/graph" data-view="graph">Query graph</a>
        <a href="/cost" data-view="cost">Cost</a>
        <a href="/changes" data-view="changes">Change reports</a>
        <a href="/browse">BigQuery</a>
      </nav>
      <div class="topbar-actions">
        <button class="toolbar-button" type="button" data-open-settings title="Settings (Ctrl+,)"><span>Settings</span></button>
        <span class="local-badge" title="Analysis runs on this computer"><span class="local-dot" aria-hidden="true"></span><span class="local-text">Running locally</span></span>
      </div>
    </header>

    <main class="insights-main">
      <header class="page-head">
        <div>
          <p id="page-eyebrow" class="eyebrow"></p>
          <h1 id="page-title">Loading…</h1>
          <p id="page-lede" class="lede"></p>
        </div>
      </header>
      <div id="preview-banner" class="preview-banner" role="note" hidden>
        <strong>Preview with sample data.</strong>
        <span>This view is not connected to your project yet. Names and numbers below are examples.</span>
        <details>
          <summary>Roadmap items this view waits on</summary>
          <ul id="preview-issues"></ul>
        </details>
      </div>
      <div id="load-error" class="load-error" role="alert" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>
</body>
</html>
