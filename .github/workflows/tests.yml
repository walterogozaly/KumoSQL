name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: pytest (sqlglot 30.21.0 compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,smt]" "sqlglotc==30.21.0" --only-binary sqlglotc
      - name: Run unit tests
        # Tests marked slow (long benchmark runs) stay deselected; the authored SQL fixture gate
        # (tests/test_workbook_fixture.py) is not slow and runs here.
        run: python -m pytest -m "not slow" -n auto --dist loadgroup
