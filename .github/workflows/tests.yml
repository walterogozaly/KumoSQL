name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: pytest (sqlglot ${{ matrix.sqlglot }}${{ matrix.compiled && ' compiled' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 30.20.0 is the pinned current release; 26.0.0 is the floor in pyproject.toml.
        sqlglot: ["30.21.0", "30.20.0", "26.0.0"]
        compiled: [false]
        include:
          # The same suite against sqlglot's mypyc build (sqlglotc), so the compiled and pure builds cannot diverge.
          - sqlglot: "30.21.0"
            compiled: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,smt]" "sqlglot==${{ matrix.sqlglot }}"
      - name: Install compiled sqlglot
        if: matrix.compiled
        run: python -m pip install "sqlglotc==${{ matrix.sqlglot }}"
      - name: Run unit tests
        # Tests marked slow (long benchmark runs) stay deselected; the authored SQL fixture gate
        # (tests/test_workbook_fixture.py) is not slow and runs here.
        run: python -m pytest -m "not slow" -n auto --dist loadgroup
