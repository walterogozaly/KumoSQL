name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  unit:
    name: pytest (sqlglot 30.21.0 compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,smt]" "sqlglotc==30.21.0" --only-binary sqlglotc
      - name: Run unit tests
        # Routine checks exclude costly floors; nightly/manual runs retain the full default suite.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/run_tests.py --label "periodic full coverage"
          else
            python tools/run_tests.py --routine --label "routine regression checks"
          fi
