name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: pytest (sqlglot ${{ matrix.sqlglot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 30.20.0 is the pinned current release; 26.0.0 is the floor in pyproject.toml.
        sqlglot: ["30.21.0", "30.20.0", "26.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,smt]" "sqlglot==${{ matrix.sqlglot }}"
      - name: Run unit tests
        # The slow workbook test needs a private local CSV, so it stays deselected.
        run: python -m pytest -m "not slow" -v
